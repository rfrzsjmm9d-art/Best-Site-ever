<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fidget Spinner Clicker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Linker Bereich: Fidget Spinner Canvas */
        .spinner-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            position: relative;
        }

        .stats-box {
            text-align: center;
            margin-bottom: 20px;
        }

        .spins-count {
            font-size: 3rem;
            font-weight: bold;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .rpm-count {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-top: 5px;
        }

        .spinner-container {
            width: 300px;
            height: 300px;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.05s ease;
        }

        .spinner-container:active {
            transform: scale(0.98);
        }

        /* SVG Spinner Styling */
        #fidget-spinner {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.3));
        }

        .spin-instruction {
            margin-top: 30px;
            color: #64748b;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Rechter Bereich: Upgrades Shop */
        .shop-area {
            width: 380px;
            background: #1e293b;
            border-left: 2px solid #334155;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .shop-title {
            font-size: 1.5rem;
            font-weight: bold;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
            color: #f8fafc;
        }

        .upgrade-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upgrade-card:hover:not(.disabled) {
            border-color: #38bdf8;
            transform: translateX(5px);
            background: #1e293b;
        }

        .upgrade-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .upgrade-info h4 {
            color: #f1f5f9;
            font-size: 1rem;
        }

        .upgrade-info p {
            color: #64748b;
            font-size: 0.8rem;
            margin-top: 3px;
        }

        .upgrade-cost {
            font-weight: bold;
            color: #38bdf8;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .upgrade-count {
            font-size: 1.5rem;
            font-weight: bold;
            color: #475569;
        }

        /* Klick-Effekt Zahlen */
        .click-pop {
            position: absolute;
            color: #38bdf8;
            font-weight: bold;
            font-size: 1.5rem;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
        }
    </style>
</head>
<body>

    <!-- Linke Seite: Spinner -->
    <div class="spinner-area">
        <div class="stats-box">
            <div class="spins-count" id="score">0 Spins</div>
            <div class="rpm-count"><span id="rpm">0</span> RPM | <span id="sps">0</span> Spins/Sekunde</div>
        </div>

        <div class="spinner-container" id="spinner-btn">
            <svg id="fidget-spinner" viewBox="0 0 200 200">
                <!-- Outer Glow / Arms -->
                <g id="spinner-body">
                    <!-- Center Body -->
                    <circle cx="100" cy="100" r="30" fill="#0284c7"/>
                    
                    <!-- Arm 1 (Top) -->
                    <path d="M 100 100 L 100 30" stroke="#0284c7" stroke-width="40" stroke-linecap="round"/>
                    <circle cx="100" cy="30" r="22" fill="#38bdf8"/>
                    <circle cx="100" cy="30" r="12" fill="#0f172a"/>

                    <!-- Arm 2 (Bottom Right) -->
                    <path d="M 100 100 L 160 135" stroke="#0284c7" stroke-width="40" stroke-linecap="round"/>
                    <circle cx="160" cy="135" r="22" fill="#38bdf8"/>
                    <circle cx="160" cy="135" r="12" fill="#0f172a"/>

                    <!-- Arm 3 (Bottom Left) -->
                    <path d="M 100 100 L 40 135" stroke="#0284c7" stroke-width="40" stroke-linecap="round"/>
                    <circle cx="40" cy="135" r="22" fill="#38bdf8"/>
                    <circle cx="40" cy="135" r="12" fill="#0f172a"/>

                    <!-- Center Bearing -->
                    <circle cx="100" cy="100" r="16" fill="#f8fafc"/>
                    <circle cx="100" cy="100" r="8" fill="#64748b"/>
                </g>
            </svg>
        </div>

        <div class="spin-instruction">Klicke schnell, um den Spinner anzuheizen!</div>
    </div>

    <!-- Rechte Seite: Upgrades -->
    <div class="shop-area">
        <div class="shop-title">Upgrades Shop</div>
        <div id="shop-list"></div>
    </div>

    <script>
        // Game State
        let spins = 0;
        let speed = 0; // Aktuelle Rotationsgeschwindigkeit (Grad pro Frame)
        let rotation = 0; // Aktueller Winkel
        let autoSpinsPerSecond = 0;

        // Upgrades Configuration
        const upgrades = [
            { id: 'click1', name: 'Leichtes Schubsen', cost: 15, power: 1, type: 'click', count: 0, desc: '+1 Schwung pro Klick' },
            { id: 'auto1', name: 'Pustender Ventilator', cost: 50, power: 1, type: 'auto', count: 0, desc: '+1 Spin/Sekunde' },
            { id: 'click2', name: 'Keramik-Kugellager', cost: 200, power: 5, type: 'click', count: 0, desc: '+5 Schwung pro Klick' },
            { id: 'auto2', name: 'Auto-Spinner Bot', cost: 500, power: 8, type: 'auto', count: 0, desc: '+8 Spins/Sekunde' },
            { id: 'click3', name: 'Öl-Schmierung', cost: 1200, power: 20, type: 'click', count: 0, desc: '+20 Schwung pro Klick' },
            { id: 'auto3', name: 'Pressluft-Düse', cost: 5000, power: 50, type: 'auto', count: 0, desc: '+50 Spins/Sekunde' },
            { id: 'auto4', name: 'Dyson-Düsenjet', cost: 25000, power: 250, type: 'auto', count: 0, desc: '+250 Spins/Sekunde' }
        ];

        let clickPower = 1;

        // DOM Elements
        const scoreEl = document.getElementById('score');
        const rpmEl = document.getElementById('rpm');
        const spsEl = document.getElementById('sps');
        const spinnerBtn = document.getElementById('spinner-btn');
        const spinnerBody = document.getElementById('spinner-body');
        const shopList = document.getElementById('shop-list');

        // Render Shop Items
        function renderShop() {
            shopList.innerHTML = '';
            upgrades.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `upgrade-card ${spins < item.cost ? 'disabled' : ''}`;
                card.onclick = () => buyUpgrade(index);
                
                card.innerHTML = `
                    <div class="upgrade-info">
                        <h4>${item.name}</h4>
                        <p>${item.desc}</p>
                        <div class="upgrade-cost">${Math.floor(item.cost)} Spins</div>
                    </div>
                    <div class="upgrade-count">${item.count}</div>
                `;
                shopList.appendChild(card);
            });
        }

        // Buy Upgrade Logic
        function buyUpgrade(index) {
            const item = upgrades[index];
            if (spins >= item.cost) {
                spins -= item.cost;
                item.count++;
                item.cost = Math.floor(item.cost * 1.15); // Preis steigt um 15%

                if (item.type === 'click') {
                    clickPower += item.power;
                } else if (item.type === 'auto') {
                    autoSpinsPerSecond += item.power;
                }

                updateUI();
                renderShop();
            }
        }

        // Click Event (Klick gibt Schwung)
        spinnerBtn.addEventListener('click', (e) => {
            speed += clickPower * 2; // Erhöht Rotationsgeschwindigkeit
            spins += clickPower;

            // Klick-Zahl-Animation
            showClickText(e.clientX, e.clientY, `+${clickPower}`);
            updateUI();
            renderShop();
        });

        function showClickText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'click-pop';
            el.innerText = text;
            el.style.left = `${x - 20}px`;
            el.style.top = `${y - 20}px`;
            document.body.appendChild(el);

            setTimeout(() => el.remove(), 800);
        }

        function updateUI() {
            scoreEl.innerText = `${Math.floor(spins)} Spins`;
            spsEl.innerText = autoSpinsPerSecond;
            // Ungefähre RPM (Umdrehungen pro Minute) Berechnung basierend auf Speed
            rpmEl.innerText = Math.floor(speed * 10);
        }

        // Game Loop (Physik & Animation)
        let lastTime = performance.now();

        function gameLoop(currentTime) {
            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            // Passive Spins von Auto-Upgrades
            if (autoSpinsPerSecond > 0) {
                spins += autoSpinsPerSecond * deltaTime;
                speed += (autoSpinsPerSecond * 0.1) * deltaTime; // Halt den Spinner optisch am Drehen
                updateUI();
                renderShop();
            }

            // Spinner Drehung anwenden
            rotation += speed;
            spinnerBody.setAttribute('transform', `rotate(${rotation} 100 100)`);

            // Reibung (Spinner bremst langsam ab)
            speed *= 0.98;
            if (speed < 0.01) speed = 0;

            requestAnimationFrame(gameLoop);
        }

        // Init
        renderShop();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
